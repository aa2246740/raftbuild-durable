name: Reliability regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install ./deploy
      - run: pnpm typecheck
      - run: pnpm raftd --help
      - run: pnpm test:reliability

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python packages/agent/test-browser/console.py
